{{ define "main" }}
<header class="page-header">
  <h1>{{ .Title }}</h1>
  {{ with .Content }}<div class="lead">{{ . }}</div>{{ end }}
</header>
<div class="tag-cloud">
  {{ range .Data.Terms.Alphabetical }}
    <a class="tag tag-lg" href="{{ .Page.RelPermalink }}">{{ .Page.Title }} <span class="count">{{ .Count }}</span></a>
  {{ end }}
</div>
{{ end }}
