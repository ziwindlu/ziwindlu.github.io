{{ if gt .Paginator.TotalPages 1 }}
<nav class="pagination" aria-label="分页">
  {{ with .Paginator.Prev }}<a class="prev" href="{{ .URL }}">← 上一页</a>{{ else }}<span></span>{{ end }}
  <span class="muted">第 {{ .Paginator.PageNumber }} / {{ .Paginator.TotalPages }} 页</span>
  {{ with .Paginator.Next }}<a class="next" href="{{ .URL }}">下一页 →</a>{{ else }}<span></span>{{ end }}
</nav>
{{ end }}
